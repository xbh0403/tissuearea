name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu covers the supported Python range; Windows and macOS guard the
        # platform-specific paths (font resolution, native path separators).
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import works with no OpenSlide installed separately
        # This is the `pip install tissuearea` promise: openslide-bin comes in
        # as a dependency, so the binding finds a native library unaided.
        run: python -c "import tissuearea; print(tissuearea.__version__)"

      - name: Console script is wired up
        run: tissuearea --version

      - name: Tests
        run: python -m pytest
